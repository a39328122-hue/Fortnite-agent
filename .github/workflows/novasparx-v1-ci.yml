name: NovaSparx v1 CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novasparx-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, publish, and validate container
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: NovaSparx.Backend.csproj

      - name: Restore dependencies
        run: dotnet restore NovaSparx.Backend.csproj

      - name: Build backend
        run: dotnet build NovaSparx.Backend.csproj --configuration Release --no-restore

      - name: Publish backend
        run: dotnet publish NovaSparx.Backend.csproj --configuration Release --output artifacts/publish --no-restore

      - name: Upload published backend
        uses: actions/upload-artifact@v4
        with:
          name: novasparx-backend
          path: artifacts/publish
          if-no-files-found: error
          retention-days: 7

      - name: Build deployment container
        run: docker build --file Dockerfile --tag novasparx-backend:ci .
