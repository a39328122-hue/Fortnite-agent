name: Build Fortnite search database

on:
  workflow_dispatch:
  push:
    paths:
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/database/fortnite_assets.gz"
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/database/fortnite_assets_new.gz"
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/database/json-src/**"
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/build_database.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build indexes
        working-directory: Fortnite-Ai-Agent-GitHub-Cloudflare
        run: python build_database.py

      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Fortnite-Ai-Agent-GitHub-Cloudflare/database/index
          git add Fortnite-Ai-Agent-GitHub-Cloudflare/database/manifest.json
          git diff --cached --quiet || git commit -m "Build Fortnite search indexes"
          git push
