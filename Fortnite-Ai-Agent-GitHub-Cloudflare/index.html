<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Fortnite Ai Agent</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-hidden="true">
      <div class="sidebar-head">
        <div class="brand brand-with-avatar">
          <img class="brand-avatar" src="./assets/fnaa-avatar.jpeg" alt="" />
          <span data-i18n="brand">Fortnite Ai Agent</span>
        </div>
        <button id="closeSidebar" class="icon-btn" type="button" aria-label="Close sidebar">×</button>
      </div>

      <button id="newChatBtn" class="sidebar-action" type="button" data-i18n="newChat">New chat</button>
      <button id="moreToolsBtn" class="sidebar-action sidebar-more" type="button">
        <span data-i18n="moreTools">More Tools</span><span>›</span>
      </button>
      <button id="settingsBtn" class="sidebar-action sidebar-more" type="button">
        <span data-i18n="settings">Settings</span><span>›</span>
      </button>

      <div class="sidebar-section-title" data-i18n="recents">Recents</div>
      <div id="recentList" class="recent-list"></div>
    </aside>

    <button id="scrim" class="scrim" type="button" aria-label="Close sidebar"></button>

    <header class="topbar">
      <button id="openSidebar" class="icon-btn" type="button" aria-label="Open sidebar">☰</button>
      <div class="topbar-title brand-with-avatar topbar-brand">
        <img class="brand-avatar" src="./assets/fnaa-avatar.jpeg" alt="" />
        <span data-i18n="brand">Fortnite Ai Agent</span>
      </div>
      <button id="discordTop" class="icon-btn" type="button" aria-label="Discord">•••</button>
    </header>

    <main id="chat" class="chat">
      <section id="welcome" class="welcome">
        <h1 data-i18n="welcomeTitle">Chat with FNAA (Fortnite Ai Agent)</h1>
        <p data-i18n="welcomeSubtitle">Fortnite files, FModel, UEFN, Verse, asset paths and research.</p>
      </section>
      <section id="messages" class="messages" aria-live="polite"></section>
    </main>

    <form id="composer" class="composer">
      <div class="composer-inner">
        <textarea
          id="messageInput"
          rows="1"
          maxlength="12000"
          placeholder="Message Fortnite Ai Agent"
          data-i18n-placeholder="messagePlaceholder"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
        <button id="sendButton" class="send-btn" type="submit" aria-label="Send">↑</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="loginGate" class="login-gate" hidden></div>

  <section id="toolsOverlay" class="tools-overlay" hidden aria-hidden="true">
    <div class="tools-shell">
      <header class="tools-header">
        <button id="toolsBackBtn" class="icon-btn" type="button" aria-label="Back">‹</button>
        <div class="tools-title" data-i18n="toolsTitle">More Tools</div>
        <div></div>
      </header>

      <div id="guestLoginBanner" class="guest-login-banner" hidden>
        <button id="guestLoginBtn" type="button">Log in for free!</button>
      </div>

      <nav class="tools-tabs" id="toolsTabs" aria-label="More tools">
        <button class="tools-tab active" data-tool="assets" type="button" data-i18n="searchTab">Search</button>
        <button class="tools-tab" data-tool="ids" type="button" data-i18n="ids">IDs</button>
        <button class="tools-tab" data-tool="devices" type="button" data-i18n="devices">Devices</button>
        <button class="tools-tab" data-tool="convert" type="button" data-i18n="convert">Convert</button>
        <button class="tools-tab" data-tool="path" type="button" data-i18n="path">Path</button>
        <button class="tools-tab" data-tool="cosmetic" type="button" data-i18n="cosmetic">Cosmetic</button>
      </nav>

      <div id="toolsContent" class="tools-content"></div>
    </div>
  </section>

  <section id="settingsOverlay" class="settings-overlay" hidden aria-hidden="true">
    <div class="settings-shell">
      <header class="settings-header">
        <button id="settingsBackBtn" class="icon-btn" type="button" aria-label="Back">‹</button>
        <div class="settings-title" data-i18n="settingsTitle">Settings</div>
        <div></div>
      </header>

      <div class="settings-content">
        <section class="settings-card">
          <div class="settings-card-icon">文</div>
          <div class="settings-card-main">
            <h2 data-i18n="changeLanguage">Change the language</h2>
            <p data-i18n="language">Language</p>
            <div class="language-grid">
              <button type="button" class="language-choice" data-set-language="en"><strong>English</strong><small>EN</small></button>
              <button type="button" class="language-choice" data-set-language="fr"><strong>Français</strong><small>FR</small></button>
              <button type="button" class="language-choice" data-set-language="ar"><strong>العربية</strong><small>AR</small></button>
            </div>
          </div>
        </section>

        <a class="settings-card settings-link"
           href="https://discord.com/users/1010719166367535155"
           target="_blank" rel="noopener noreferrer">
          <div class="settings-card-icon">@</div>
          <div class="settings-card-main">
            <h2 data-i18n="dmOwner">DM the owner</h2>
            <p data-i18n="ownerHint">@its.swag on Discord</p>
          </div>
          <span class="settings-arrow">›</span>
        </a>
      </div>
    </div>
  </section>

  <script src="./i18n.js"></script>
  <script src="./config.js"></script>
  <script src="./tools.js"></script>
  <script src="./app.js"></script>
</body>
</html>
