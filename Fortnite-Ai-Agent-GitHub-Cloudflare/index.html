<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Fortnite Ai Agent</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-hidden="true">
      <div class="sidebar-head">
        <div class="brand">Fortnite Ai Agent</div>
        <button id="closeSidebar" class="icon-btn" type="button" aria-label="Close sidebar">×</button>
      </div>

      <button id="newChatBtn" class="sidebar-action" type="button">＋ New chat</button>
      <a class="sidebar-link" href="https://th3dryz69.github.io/FortniteToolsWeb/public/html/searchAssets.html" target="_blank" rel="noopener noreferrer">
        Fortnite asset path
      </a>
      <button id="moreToolsBtn" class="sidebar-action sidebar-more" type="button">
        More Tools <span>›</span>
      </button>

      <div class="sidebar-section-title">Recents</div>
      <div id="recentList" class="recent-list"></div>
    </aside>

    <button id="scrim" class="scrim" type="button" aria-label="Close sidebar"></button>

    <header class="topbar">
      <button id="openSidebar" class="icon-btn" type="button" aria-label="Open sidebar">☰</button>
      <div class="topbar-title">Fortnite Ai Agent</div>
      <button id="discordTop" class="icon-btn" type="button" aria-label="Discord">•••</button>
    </header>

    <main id="chat" class="chat">
      <section id="welcome" class="welcome">
        <h1>Fortnite Ai Agent</h1>
        <p>Fortnite files, FModel, UEFN, Verse, asset paths and research.</p>
      </section>
      <section id="messages" class="messages" aria-live="polite"></section>
    </main>

    <form id="composer" class="composer">
      <div class="composer-inner">
        <textarea
          id="messageInput"
          rows="1"
          maxlength="12000"
          placeholder="Message Fortnite Ai Agent"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
        <button id="sendButton" class="send-btn" type="submit" aria-label="Send">↑</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="loginGate" class="login-gate" hidden></div>

  <section id="toolsOverlay" class="tools-overlay" hidden aria-hidden="true">
    <div class="tools-shell">
      <header class="tools-header">
        <button id="toolsBackBtn" class="icon-btn" type="button" aria-label="Back">‹</button>
        <div class="tools-title">More Tools</div>
        <div class="tools-header-spacer"></div>
      </header>

      <div id="guestLoginBanner" class="guest-login-banner" hidden>
        <button id="guestLoginBtn" type="button">Log in for free!</button>
      </div>

      <div class="tools-tabs" id="toolsTabs" role="tablist">
        <button class="tools-tab active" data-tool="assets" type="button">Assets</button>
        <button class="tools-tab" data-tool="ids" type="button">ID's</button>
        <button class="tools-tab" data-tool="devices" type="button">DeviceMeshes</button>
        <button class="tools-tab" data-tool="convert" type="button">Convert</button>
        <button class="tools-tab" data-tool="path" type="button">Path</button>
        <button class="tools-tab" data-tool="cosmetic" type="button">Cosmetic</button>
      </div>

      <div id="toolsContent" class="tools-content"></div>
    </div>
  </section>

  <script src="./config.js"></script>
  <script src="./tools.js"></script>
  <script src="./app.js"></script>
</body>
</html>
