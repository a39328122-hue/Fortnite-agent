<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="Fortnite Ai Agent by YT @27lf — built for Fortnite files, asset paths, FModel, UEFN and Verse." />
  <title>Fortnite Ai Agent</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <div class="sidebar-top">
        <button class="icon-button" id="closeSidebar" type="button" aria-label="Close menu">
          <span aria-hidden="true">×</span>
        </button>
        <div class="sidebar-brand">Fortnite Ai Agent</div>
      </div>

      <nav class="sidebar-nav" aria-label="Main navigation">
        <button class="nav-item active" id="newChatBtn" type="button">
          <span class="nav-icon">＋</span>
          <span>New chat</span>
        </button>

        <a class="nav-item" href="https://th3dryz69.github.io/FortniteToolsWeb/public/html/searchAssets.html" target="_blank" rel="noopener noreferrer">
          <span class="nav-icon path-icon">⌘</span>
          <span>Fortnite asset path</span>
          <span class="external">↗</span>
        </a>

        <button class="nav-item" id="discordSidebar" type="button">
          <span class="nav-icon discord-small">◉</span>
          <span>Discord @its.swag</span>
        </button>
      </nav>

      <div class="recent-wrap">
        <div class="section-label">Recents</div>
        <div class="recent-list" id="recentList"></div>
      </div>

      <div class="sidebar-footer">
        <div class="credit">Developed by YT @27lf</div>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-button" id="openSidebar" type="button" aria-label="Open menu">
          <span class="hamburger" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>

        <div class="model-title">Fortnite Ai Agent</div>

        <button class="discord-button" id="discordTop" type="button" aria-label="Open Discord profile @its.swag" title="Discord @its.swag">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.5 5.3A16.1 16.1 0 0 0 15.4 4l-.5 1a14.7 14.7 0 0 0-5.8 0l-.5-1a16 16 0 0 0-4.1 1.3C1.9 9.2 1.2 13 1.5 16.7a16.5 16.5 0 0 0 5 2.5l1.2-1.7a10.6 10.6 0 0 1-1.9-.9l.5-.4c3.7 1.7 7.7 1.7 11.4 0l.5.4a12 12 0 0 1-1.9.9l1.2 1.7a16.4 16.4 0 0 0 5-2.5c.4-4.3-.8-8-3-11.4ZM8.7 14.5c-1.1 0-2-1-2-2.2 0-1.2.9-2.2 2-2.2s2 1 2 2.2c0 1.2-.9 2.2-2 2.2Zm6.6 0c-1.1 0-2-1-2-2.2 0-1.2.9-2.2 2-2.2s2 1 2 2.2c0 1.2-.9 2.2-2 2.2Z" />
          </svg>
        </button>
      </header>

      <section class="chat" id="chat" aria-live="polite">
        <div class="welcome" id="welcome">
          <h1>Fortnite Ai Agent</h1>
          <p>Fortnite files, asset paths, FModel, UEFN &amp; Verse.</p>
          <a href="https://www.youtube.com/@27lf" target="_blank" rel="noopener noreferrer">Subscribe To My YT Channel @27lf</a>
        </div>

        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="composer" autocomplete="off">
          <textarea id="messageInput" rows="1" maxlength="12000" placeholder="Ask Fortnite Ai Agent" aria-label="Message Fortnite Ai Agent"></textarea>
          <button class="send-button" id="sendButton" type="submit" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 5.5 10.5l1.4 1.4 4.1-4.1V20h2V7.8l4.1 4.1 1.4-1.4L12 4Z"/></svg>
          </button>
        </form>
        <div class="under-composer">Developed by YT @27lf</div>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </div>

  <script src="./config.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
